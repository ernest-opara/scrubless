[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Railway's edge is the only path to this container, so it's safe to trust
# X-Forwarded-For / X-Forwarded-Proto from any source. uvicorn then rewrites
# request.client.host to the real visitor IP, which makes rate-limit keys
# and traffic-source attribution correct for every reader of client.host.
startCommand = "uvicorn app:app --host 0.0.0.0 --port 8080 --proxy-headers --forwarded-allow-ips=*"
healthcheckPath = "/"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[service]
internalPort = 8080
