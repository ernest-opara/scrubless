<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350" width="300" height="350">
  <!-- Scrubby — The Scrubless Mascot -->

  <!-- Antenna/cowlick -->
  <path d="M150,52 Q145,25 158,30" fill="none" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>
  <circle cx="158" cy="28" r="6" fill="#FFD54F"/>

  <!-- Body — rounded screen shape -->
  <rect x="80" y="85" width="140" height="120" rx="28" fill="#FBBF24"/>

  <!-- Screen shine -->
  <rect x="92" y="95" width="30" height="12" rx="6" fill="#FFD54F" opacity="0.6"/>

  <!-- HUGE eyes -->
  <ellipse cx="128" cy="130" rx="22" ry="26" fill="white"/>
  <ellipse cx="178" cy="130" rx="22" ry="26" fill="white"/>

  <!-- Pupils -->
  <circle cx="134" cy="128" r="14" fill="#1a1a2e"/>
  <circle cx="184" cy="128" r="14" fill="#1a1a2e"/>

  <!-- Eye sparkle -->
  <circle cx="140" cy="120" r="6" fill="white"/>
  <circle cx="132" cy="132" r="3" fill="white"/>
  <circle cx="190" cy="120" r="6" fill="white"/>
  <circle cx="182" cy="132" r="3" fill="white"/>

  <!-- BIG happy smile -->
  <path d="M122,165 Q153,195 184,165" fill="#B8860B"/>
  <path d="M126,165 Q153,190 180,165" fill="#1a1a2e"/>
  <!-- Tongue -->
  <ellipse cx="155" cy="178" rx="12" ry="8" fill="#FF6B8A"/>

  <!-- Play button on belly -->
  <polygon points="144,155 144,168 156,161.5" fill="#1a1a2e" opacity="0.15"/>

  <!-- Stubby arms -->
  <ellipse cx="72" cy="145" rx="18" ry="14" fill="#E5A800"/>
  <ellipse cx="228" cy="145" rx="18" ry="14" fill="#E5A800"/>

  <!-- Stubby legs -->
  <ellipse cx="122" cy="218" rx="20" ry="16" fill="#E5A800"/>
  <ellipse cx="178" cy="218" rx="20" ry="16" fill="#E5A800"/>
</svg>
