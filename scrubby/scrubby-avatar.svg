<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Scrubby Avatar -->

  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="#0A1628"/>
  <circle cx="200" cy="200" r="195" fill="none" stroke="#FBBF24" stroke-width="2.5" opacity="0.25"/>

  <!-- Antenna/cowlick -->
  <path d="M200,92 Q195,65 208,70" fill="none" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>
  <circle cx="208" cy="68" r="6" fill="#FFD54F"/>

  <!-- Body -->
  <rect x="130" y="125" width="140" height="120" rx="28" fill="#FBBF24"/>

  <!-- Screen shine -->
  <rect x="142" y="135" width="30" height="12" rx="6" fill="#FFD54F" opacity="0.6"/>

  <!-- HUGE eyes -->
  <ellipse cx="178" cy="170" rx="22" ry="26" fill="white"/>
  <ellipse cx="228" cy="170" rx="22" ry="26" fill="white"/>

  <!-- Pupils -->
  <circle cx="184" cy="168" r="14" fill="#1a1a2e"/>
  <circle cx="234" cy="168" r="14" fill="#1a1a2e"/>

  <!-- Eye sparkle -->
  <circle cx="190" cy="160" r="6" fill="white"/>
  <circle cx="182" cy="172" r="3" fill="white"/>
  <circle cx="240" cy="160" r="6" fill="white"/>
  <circle cx="232" cy="172" r="3" fill="white"/>

  <!-- BIG happy smile -->
  <path d="M172,205 Q203,235 234,205" fill="#B8860B"/>
  <path d="M176,205 Q203,230 230,205" fill="#1a1a2e"/>
  <!-- Tongue -->
  <ellipse cx="205" cy="218" rx="12" ry="8" fill="#FF6B8A"/>

  <!-- Play button on belly -->
  <polygon points="194,195 194,208 206,201.5" fill="#1a1a2e" opacity="0.15"/>

  <!-- Stubby arms -->
  <ellipse cx="122" cy="185" rx="18" ry="14" fill="#E5A800"/>
  <ellipse cx="278" cy="185" rx="18" ry="14" fill="#E5A800"/>

  <!-- Stubby legs -->
  <ellipse cx="172" cy="258" rx="20" ry="16" fill="#E5A800"/>
  <ellipse cx="228" cy="258" rx="20" ry="16" fill="#E5A800"/>
</svg>
