    <ellipse cx="128" cy="130" rx="22" ry="26" fill="white"/>
    <ellipse cx="178" cy="130" rx="22" ry="26" fill="white"/>
    <circle cx="134" cy="128" r="14" fill="#1a1a2e"/>
    <circle cx="184" cy="128" r="14" fill="#1a1a2e"/>
    <circle cx="140" cy="120" r="6" fill="white"/>
    <circle cx="132" cy="132" r="3" fill="white"/>
    <circle cx="190" cy="120" r="6" fill="white"/>
