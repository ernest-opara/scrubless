<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrubless — stop scrubbing, start searching</title>
    <link rel="icon" type="image/svg+xml" href="/scrubby/scrubby-avatar.svg" />
    <style>
      :root {
        --canvas: #16171a;
        --panel: #1f2125;
        --panel-2: #0f1012;
        --screen: #0a0a0b;
        --ink: #e9e9ec;
        --muted: #9a9aa1;
        --faint: #646469;
        --line: #2f3137;
        --accent: #84e04a;
        --accent-ink: #13160d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 1040px; margin: 0 auto; padding: 28px 24px 60px; }

      header {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        border-bottom: 1px solid var(--line); padding-bottom: 18px; margin-bottom: 32px;
      }
      .logo { width: 40px; height: 40px; border-radius: 50%; display: block; }
      h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
      header p { margin: 0; font-size: 12px; color: var(--muted); }

      /* Scrubby — the mascot */
      .hero-mascot {
        width: 104px; height: auto; display: block; margin: 0 auto 16px;
        animation: bob 3s ease-in-out infinite;
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }

      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
      .hidden { display: none !important; }
      .muted { color: var(--muted); }
      .faint { color: var(--faint); }

      /* upload */
      #drop {
        border: 1px dashed var(--line); border-radius: 10px; background: var(--panel);
        padding: 64px 24px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
      }
      #drop.over { border-color: var(--accent); background: #1e2817; }
      #drop h2 { margin: 0 0 4px; font-size: 18px; }
      #drop .hint { font-size: 13px; color: var(--muted); }

      .btn {
        background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 7px;
        padding: 11px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
      }
      .btn:hover { filter: brightness(0.95); }
      .btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .btn-ghost {
        background: transparent; color: var(--ink); border: 1px solid var(--line);
        border-radius: 7px; padding: 9px 18px; font-size: 13px; cursor: pointer;
      }
      .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

      /* progress */
      #processing { padding: 56px 24px; text-align: center; }
      #processing h2 { margin: 0 0 4px; font-size: 17px; }
      .bar { height: 6px; background: var(--panel-2); border-radius: 999px; overflow: hidden; margin: 22px auto 0; max-width: 420px; }
      .bar > div { height: 100%; background: var(--accent); width: 0%; transition: width .5s ease; }

      /* workspace */
      #workspace { display: grid; grid-template-columns: 1.4fr 1fr; gap: 22px; }
      @media (max-width: 800px) { #workspace { grid-template-columns: 1fr; } }
      video { width: 100%; aspect-ratio: 16/9; background: var(--screen); border-radius: 10px; border: 1px solid var(--line); display: block; }
      #vtitle { font-size: 15px; font-weight: 600; margin: 0 0 12px; }

      .searchrow { display: flex; gap: 8px; }
      #query {
        flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
        padding: 10px 12px; color: var(--ink); font-size: 14px;
      }
      #query::placeholder { color: var(--faint); }
      #query:focus { outline: none; border-color: var(--accent); }

      #results { margin-top: 14px; display: flex; flex-direction: column; gap: 9px; max-height: 62vh; overflow-y: auto; }
      .result {
        display: flex; gap: 11px; padding: 10px; background: var(--panel);
        border: 1px solid var(--line); border-radius: 9px; cursor: pointer; text-align: left;
        transition: border-color .12s, transform .12s;
      }
      .result:hover { border-color: var(--accent); transform: translateY(-1px); }
      .result img { width: 116px; height: 66px; object-fit: cover; border-radius: 6px; background: var(--screen); flex-shrink: 0; }
      .result .meta { min-width: 0; flex: 1; }
      .result .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .result .time { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .badge {
        font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 5px;
        background: var(--accent); color: var(--accent-ink); flex-shrink: 0;
      }
      .badge.weak { background: transparent; color: var(--muted); border: 1px solid var(--line); }
      .result .desc { font-size: 12.5px; color: var(--muted); margin: 3px 0 0; }
      .result .snip { font-size: 11.5px; color: var(--faint); font-style: italic; margin: 3px 0 0; }
      .empty { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 13px;
        border: 1px dashed var(--line); border-radius: 9px; }
      .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .clamp1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div style="display:flex;align-items:center;gap:10px">
          <img class="logo" src="/scrubby/scrubby-avatar.svg" alt="Scrubby, the Scrubless mascot" />
          <div>
            <h1>Scrubless</h1>
            <p>Stop scrubbing. Start searching.</p>
          </div>
        </div>
        <div id="authArea" style="display:flex;align-items:center;gap:10px;font-size:13px"></div>
      </header>

      <!-- 1. Upload -->
      <section id="upload">
        <img class="hero-mascot" id="landingMascot" src="/scrubby/scrubby.svg" alt="Scrubby" />
        <div id="drop">
          <h2>Drop a video here</h2>
          <div class="hint">or click to choose a file — MP4, MOV, MKV, WEBM</div>
          <div class="hint" id="limitHint" style="margin-top:6px;color:var(--faint)">Max 500MB</div>
        </div>
        <p style="text-align:center;font-size:12px;color:var(--muted);margin:12px 0 0">
          🔒 No account needed · auto-deletes in 24h · delete it anytime
        </p>
        <input id="file" type="file" accept="video/*" class="hidden" />
        <p id="uperr" class="hidden" style="color:#e0623e;font-size:13px;margin-top:12px"></p>
        <div style="text-align:center;margin-top:18px">
          <span class="muted" style="font-size:13px">No video handy? </span>
          <button class="btn-ghost" id="trysample">▶&nbsp; Try a sample video</button>
        </div>
      </section>

      <!-- 2. Processing -->
      <section id="processing" class="panel hidden">
        <img src="/scrubby/scrubby-searching.svg" alt="Scrubby is scanning your video"
             style="width:88px;height:auto;display:block;margin:0 auto 12px;animation:bob 2s ease-in-out infinite" />
        <h2>Indexing your video</h2>
        <p class="muted" id="pstage" style="margin:0;font-size:13px">Extracting frames…</p>
        <div class="bar"><div id="pfill"></div></div>
        <p class="faint" id="ppct" style="font-size:13px;margin-top:10px">0%</p>
      </section>

      <!-- 3. Workspace -->
      <section id="workspace" class="hidden">
        <div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px">
            <p id="vtitle" style="margin:0"></p>
            <button class="btn-ghost" id="deletebtn" style="display:none">Delete</button>
          </div>
          <video id="player" controls playsinline></video>
        </div>
        <div>
          <div class="searchrow">
            <input id="query" type="text" placeholder="find the part where someone is laughing" />
            <button class="btn" id="searchbtn">Search</button>
          </div>
          <div id="results">
            <div class="empty">Search your video to find matching moments.</div>
          </div>
        </div>
      </section>
    </div>

    <script>
      var videoId = null;
      var pollTimer = null;
      var authState = {
        user: null,
        upload_limit_bytes: 500 * 1024 * 1024,
        auth_enabled: false,
      };

      function fmtMB(bytes) {
        return Math.round(bytes / (1024 * 1024)) + "MB";
      }

      // Load auth state + the caller's upload limit, then render the header.
      function loadAuth() {
        fetch("/api/auth/me")
          .then(function (r) { return r.json(); })
          .then(function (s) {
            authState = s;
            renderAuth();
            var hint = document.getElementById("limitHint");
            if (hint) hint.textContent = "Max " + fmtMB(s.upload_limit_bytes);
          })
          .catch(function () {});
      }

      function renderAuth() {
        var el = document.getElementById("authArea");
        if (!el) return;
        if (authState.user) {
          el.innerHTML =
            '<span class="muted">' + authState.user.email +
            ' · <strong style="color:var(--accent)">' + authState.user.tier +
            '</strong></span>' +
            '<button class="btn-ghost" onclick="location.href=\'/api/auth/logout\'">Log out</button>';
        } else if (authState.auth_enabled) {
          el.innerHTML =
            '<button class="btn-ghost" onclick="location.href=\'/api/auth/login\'">Log in</button>';
        } else {
          el.innerHTML = "";
        }
      }

      // Swap Scrubby's mood: idle (happy) <-> excited (file dragged over).
      function setMascot(state) {
        var m = document.getElementById("landingMascot");
        if (m) {
          m.src =
            state === "excited"
              ? "/scrubby/scrubby-excited.svg"
              : "/scrubby/scrubby.svg";
        }
      }

      function fmtTime(s) {
        s = Math.max(0, Math.floor(s));
        var m = Math.floor(s / 60), sec = s % 60;
        return m + ":" + (sec < 10 ? "0" : "") + sec;
      }
      // CLIP cosine similarity is compressed (~0.15 weak, ~0.32 strong);
      // rescale to an intuitive confidence figure.
      function confidence(score) {
        var t = Math.min(1, Math.max(0, (score - 0.13) / (0.32 - 0.13)));
        return Math.round((0.55 + 0.44 * t) * 100);
      }
      function show(id) { document.getElementById(id).classList.remove("hidden"); }
      function hide(id) { document.getElementById(id).classList.add("hidden"); }

      // --- Upload ---
      var drop = document.getElementById("drop");
      var fileInput = document.getElementById("file");
      drop.addEventListener("click", function () { fileInput.click(); });
      drop.addEventListener("dragover", function (e) { e.preventDefault(); drop.classList.add("over"); setMascot("excited"); });
      drop.addEventListener("dragleave", function () { drop.classList.remove("over"); setMascot("idle"); });
      drop.addEventListener("drop", function (e) {
        e.preventDefault(); drop.classList.remove("over"); setMascot("idle");
        if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
      });
      fileInput.addEventListener("change", function () {
        if (fileInput.files[0]) uploadFile(fileInput.files[0]);
      });

      // --- Try the pre-indexed sample video ---
      document.getElementById("trysample").addEventListener("click", function () {
        videoId = "sample";
        hide("upload");
        show("processing");
        pollTimer = setInterval(pollStatus, 2000);
        pollStatus();
      });

      function uploadFile(file) {
        if (file.size > authState.upload_limit_bytes) {
          var msg = document.getElementById("uperr");
          var lim = fmtMB(authState.upload_limit_bytes);
          if (!authState.user && authState.auth_enabled) {
            msg.innerHTML =
              "That file is over " + lim +
              '. <a href="/api/auth/login" style="color:var(--accent)">Sign in</a> to upload larger videos.';
          } else if (authState.user) {
            msg.textContent =
              "Your " + authState.user.tier + " plan allows up to " + lim +
              " — upgrade for larger uploads.";
          } else {
            msg.textContent = "That file is over " + lim + " — try a shorter clip.";
          }
          msg.classList.remove("hidden");
          return;
        }
        var form = new FormData();
        form.append("file", file);
        document.getElementById("uperr").classList.add("hidden");
        drop.querySelector("h2").textContent = "Uploading…";
        drop.querySelector(".hint").textContent = file.name;

        fetch("/api/upload", { method: "POST", body: form })
          .then(function (r) {
            if (!r.ok) throw new Error("upload failed (" + r.status + ")");
            return r.json();
          })
          .then(function (data) {
            videoId = data.id;
            hide("upload");
            show("processing");
            pollTimer = setInterval(pollStatus, 2000);
            pollStatus();
          })
          .catch(function (err) {
            var e = document.getElementById("uperr");
            e.textContent = err.message;
            e.classList.remove("hidden");
            drop.querySelector("h2").textContent = "Drop a video here";
            drop.querySelector(".hint").textContent = "or click to choose a file";
          });
      }

      // --- Processing poll ---
      function pollStatus() {
        fetch("/api/status/" + videoId)
          .then(function (r) { return r.json(); })
          .then(function (s) {
            document.getElementById("pfill").style.width = s.progress + "%";
            document.getElementById("ppct").textContent = s.progress + "%";
            if (s.status === "indexed") {
              clearInterval(pollTimer);
              startWorkspace(s);
            } else if (s.status === "error") {
              clearInterval(pollTimer);
              document.getElementById("processing").innerHTML =
                '<h2 style="color:#e0623e">Processing failed</h2><p class="muted">' +
                (s.error || "") + "</p>";
            }
          })
          .catch(function () { /* transient — keep polling */ });
      }

      // --- Workspace ---
      function startWorkspace(status) {
        hide("processing");
        show("workspace");
        document.getElementById("vtitle").textContent = status.title || "";
        document.getElementById("player").src = status.source_url;
        // The sample is Big Buck Bunny — nudge the visitor toward a query
        // that actually matches it.
        if (videoId === "sample") {
          document
            .getElementById("query")
            .setAttribute("placeholder", "try: a rabbit in a green meadow");
        }
        document.getElementById("deletebtn").style.display =
          videoId === "sample" ? "none" : "inline-block";
      }

      document.getElementById("deletebtn").addEventListener("click", function () {
        if (!confirm("Delete this video and its index?")) return;
        fetch("/api/videos/" + videoId, { method: "DELETE" }).then(function () {
          location.reload();
        });
      });

      var player = document.getElementById("player");
      var queryInput = document.getElementById("query");
      var searchBtn = document.getElementById("searchbtn");

      function runSearch() {
        var q = queryInput.value.trim();
        if (!q) return;
        searchBtn.disabled = true;
        searchBtn.textContent = "Searching…";
        fetch("/api/search/" + videoId, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: q }),
        })
          .then(function (r) {
            if (!r.ok) throw new Error("search failed (" + r.status + ")");
            return r.json();
          })
          .then(renderResults)
          .catch(function (err) {
            document.getElementById("results").innerHTML =
              '<div class="empty" style="color:#e0623e">' + err.message + "</div>";
          })
          .finally(function () {
            searchBtn.disabled = false;
            searchBtn.textContent = "Search";
          });
      }
      searchBtn.addEventListener("click", runSearch);
      queryInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") runSearch();
      });

      function renderResults(results) {
        var box = document.getElementById("results");
        box.innerHTML = "";
        if (!results.length) {
          box.innerHTML = '<div class="empty">No matching moments found. Try other words.</div>';
          return;
        }
        results.forEach(function (r) {
          var conf = confidence(r.score);
          var card = document.createElement("div");
          card.className = "result";
          card.innerHTML =
            '<img src="' + r.frame_url + '" alt="" />' +
            '<div class="meta">' +
              '<div class="top">' +
                '<span class="time">' + fmtTime(r.timestamp) + "</span>" +
                '<span class="badge' + (conf >= 85 ? "" : " weak") + '">' + conf + "% match</span>" +
              "</div>" +
              '<p class="desc clamp2">' + (r.description || "Matched moment") + "</p>" +
              (r.transcript_snippet
                ? '<p class="snip clamp1">“' + r.transcript_snippet + '”</p>'
                : "") +
            "</div>";
          card.addEventListener("click", function () {
            player.currentTime = r.timestamp;
            player.play();
            player.scrollIntoView({ behavior: "smooth", block: "center" });
          });
          box.appendChild(card);
        });
      }

      loadAuth(); // header state + the caller's upload limit
    </script>
  </body>
</html>
